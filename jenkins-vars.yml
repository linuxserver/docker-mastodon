---

# jenkins variables
project_name: docker-mastodon
external_type: custom_json
custom_release_notes_command: |-
  curl -H "Authorization: token ${GITHUB_TOKEN}" -s https://api.github.com/repos/mastodon/mastodon/releases/tags/${EXT_RELEASE} | jq -r '. |.body' | sed -E 's|#([0-9]+)|[#\\1](https://github.com/mastodon/mastodon/pull/\\1)|g' | sed -E "s|(srcs?e?t?=\\")\\./|\\1https://github.com/mastodon/mastodon/raw/${EXT_RELEASE}/|g" > releasebody.json
release_type: prerelease
release_tag: develop
ls_branch: develop
image_builder: default
repo_vars:
  - JSON_URL='https://api.github.com/repos/mastodon/mastodon/releases'
  - JSON_PATH='first(.[] | select(.prerelease==true)) | .tag_name'
  - EXT_GIT_BRANCH = 'main'
  - EXT_USER = 'mastodon'
  - EXT_REPO = 'mastodon'
  - CONTAINER_NAME = 'mastodon'
  - BUILD_VERSION_ARG = 'MASTODON_VERSION'
  - LS_USER = 'linuxserver'
  - LS_REPO = 'docker-mastodon'
  - DOCKERHUB_IMAGE = 'linuxserver/mastodon'
  - DEV_DOCKERHUB_IMAGE = 'lsiodev/mastodon'
  - PR_DOCKERHUB_IMAGE = 'lspipepr/mastodon'
  - DIST_IMAGE = 'alpine'
  - MULTIARCH='true'
  - CI='false'
  - CI_WEB='false'
  - CI_PORT='80'
  - CI_SSL='false'
  - CI_DELAY='60'
  - CI_DOCKERENV=''
  - CI_AUTH=''
  - CI_WEBPATH=''
